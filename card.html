<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#d6e6bf;--bg2:#8da676;--ink:#5a3f1c;--mute:#5f6f49;--cream:#fdf9dc;--brown:#674a25;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(110% 80% at 50% 35%,var(--bg1),var(--bg2));color:var(--ink);font-family:"Huninn","Zen Maru Gothic","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;overflow:hidden;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
header{text-align:center;padding:10px clamp(14px,3.2vw,30px) 0;position:relative;z-index:2}.card-nav{width:100%;max-width:1120px;min-height:46px;margin:0 auto 8px;display:flex;align-items:center;justify-content:space-between;gap:18px;text-align:left;font-size:12px}.card-nav a{color:#52684b;text-decoration:none;transition:color .18s ease}.card-nav a:hover{color:#62864c}.card-nav-brand{display:flex;align-items:center;gap:5px;font-weight:900;letter-spacing:-.035em}.card-nav-brand span{color:#87917f;font-weight:800}.card-nav-links{display:flex;align-items:center;gap:24px;font-weight:700;letter-spacing:.04em}.card-nav-links a[aria-current="page"]{color:#62864c}.card-nav-links a{padding:8px 0}
h1{margin:0;font-size:clamp(26px,5vw,38px);letter-spacing:.18em;color:var(--brown);text-shadow:0 2px 0 #fdf9dc99}
.hint{margin:10px auto 0;width:fit-content;max-width:min(30em,92vw);text-align:center;color:var(--mute);font-size:12.5px;line-height:1.5}
.hint b{color:var(--brown)}
.hint ol{margin:4px 0 0;padding:0;list-style-position:inside}
.stage{flex:1;min-height:0;position:relative;z-index:0;perspective:1700px;touch-action:pan-y;cursor:grab;outline:none}
.stage.drag{cursor:grabbing}
.stage:focus-visible{box-shadow:inset 0 0 0 3px #ffd76a}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:translateY(clamp(38px,7vh,62px)) rotateX(-7deg)}
.ring{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.slot{position:absolute;left:50%;top:50%;width:var(--w);height:calc(var(--w)*1.5115);margin:calc(var(--w)*-.7557) 0 0 calc(var(--w)*-.5);transform-style:preserve-3d}
.card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.5,.4,1)}
.card.flipped{transform:translate3d(0,-4%,110px) scale(1.12);animation:rise .8s ease-out}
@keyframes rise{0%{transform:translate3d(0,60%,-80px) scale(.85)}45%{transform:translate3d(0,-18%,170px) scale(1.22)}72%{transform:translate3d(0,3%,100px) scale(1.1)}100%{transform:translate3d(0,-4%,110px) scale(1.12)}}
.card.flipped .face{filter:drop-shadow(0 0 16px #fffffff2) drop-shadow(0 0 42px #ffffff99) drop-shadow(0 18px 26px #000b)}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.3,1.25,.4,1)}
.card.flipped .inner{transform:rotateY(180deg)}
.card.pop .inner{animation:pop .85s}
@keyframes pop{0%,100%{translate:0 0 0}40%{translate:0 -12px 50px}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:7%;overflow:hidden;filter:drop-shadow(0 8px 14px #0006) brightness(var(--dim,1))}
.face img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.front{transform:rotateY(180deg)}
.rear{transform:rotateY(180deg);display:none}
.slot.away .front{visibility:hidden}
.slot.away .card:not(.flipped) .rear{display:block}
.slot.away .card:not(.flipped) .back{visibility:hidden}
.shine{position:absolute;inset:-20%;pointer-events:none;opacity:0;mix-blend-mode:soft-light;background:linear-gradient(115deg,transparent 35%,#fff9 46%,#fffffff0 50%,#ffffffaa 54%,transparent 65%);transform:translateX(-60%)}
.card.flipped .shine{animation:sweep 1.1s .25s ease-out}
@keyframes sweep{0%{opacity:1;transform:translateX(-60%)}100%{opacity:1;transform:translateX(60%)}}
.info,.gorow{position:relative;z-index:1}.info{text-align:center;padding:2px 12px 10px;min-height:3.8em;transform:translateY(16px)}
.name{font-size:22px;font-weight:700;letter-spacing:.15em;min-height:1.4em;color:var(--brown)}
.sub{color:var(--mute);font-size:13px}
.fab{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:3;width:58px;height:58px;border-radius:50%;border:3px solid var(--brown);background:var(--cream);padding:6px;cursor:pointer;box-shadow:0 4px 0 #4a3418,0 8px 18px #0003;transition:transform .2s}
.fab img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.fab.open{transform:rotate(-8deg) scale(1.06)}
.fab:focus-visible,.menu button:focus-visible{outline:3px solid var(--brown);outline-offset:3px}
.menu{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;flex-direction:column;gap:8px;min-width:156px;padding:12px;border-radius:20px;background:var(--cream);border:3px solid var(--brown);box-shadow:0 8px 24px #0003;opacity:0;transform:translateY(10px) scale(.95);transform-origin:bottom right;pointer-events:none;transition:opacity .2s,transform .2s}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.menu button{font:inherit;font-size:15px;color:var(--brown);background:#bad3a466;border:2px solid #674a2566;border-radius:999px;padding:8px 16px;cursor:pointer;text-align:center}
.menu button:hover{background:#bad3a4cc}
.vol{display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--brown);padding:4px 6px 0;text-align:center}
.vol input{width:100%;accent-color:var(--brown)}
.mf{position:fixed;left:0;top:0;width:var(--ms,90px);height:var(--ms,90px);z-index:6;pointer-events:none;opacity:0;will-change:transform}
.mf.rl img{transform:scaleX(-1)}
.mf.rl .mst{right:auto;left:65%;background:linear-gradient(to right,#ffffffe6,#ffffff00)}
.mf img{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 8px #0004)}
.mf .mst{position:absolute;right:65%;top:22%;width:230%;height:56%;border-radius:50%;background:linear-gradient(to left,#ffffffe6,#ffffff00);filter:blur(3px);opacity:0}
.card.sel{transform:translate3d(0,-8%,80px) scale(1.07)}
.card.sel .face{filter:drop-shadow(0 0 14px #fffffff0) drop-shadow(0 0 32px #ffffff88) drop-shadow(0 14px 20px #000a)}
.mk{position:absolute;top:5%;right:6%;width:2em;height:2em;border-radius:50%;background:#fff;color:#1b1d21;display:none;place-items:center;font-weight:700;font-size:clamp(12px,3.4vw,18px);line-height:1;box-shadow:0 2px 8px #0007}
.card.sel .mk{display:grid}
.gorow{text-align:center;padding:0 12px clamp(14px,3vh,30px)}
#clr{font:inherit;margin-top:12px;font-size:14px;padding:6px 22px;color:var(--brown);background:transparent;border:2px solid #674a2599;border-radius:999px;cursor:pointer}
#clr:disabled{opacity:.3;cursor:default}
#clr:not(:disabled):hover{background:#fdf9dc88}
#go{font:inherit;cursor:pointer;background:var(--brown);color:var(--cream);border:3px solid #4a3418;border-radius:999px;padding:12px 52px;font-size:20px;font-weight:700;letter-spacing:.3em;text-indent:.3em;box-shadow:0 5px 0 #4a3418,0 10px 22px #0003;transition:transform .1s,box-shadow .1s}
#go:not(:disabled):active{transform:translateY(3px);box-shadow:0 2px 0 #4a3418}
#go:focus-visible{outline:3px solid #ffd76a;outline-offset:3px}
#go:disabled{opacity:.35;cursor:default}
.rv{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:16px;background:rgba(44,62,34,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s}
.rv.on{opacity:1;pointer-events:auto}
.rvrow{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 14px}
.rc{position:relative;width:var(--cw);height:calc(var(--cw)*1.5115);perspective:900px}
.rp{position:absolute;inset:0;transform-style:preserve-3d;opacity:0}
.ri{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.3,1.25,.4,1)}
.rc.flip .ri{transform:rotateY(180deg)}
.rvt{color:#fff;text-align:center;opacity:0;transition:opacity .4s}
.rvt.on{opacity:1}
.rvt b{display:block;font-size:22px;letter-spacing:.15em}
.rvt span{font-size:14px;color:#ffffffb8}
.rc.ready{cursor:pointer;transition:transform .25s}
.rc.ready:hover{transform:translateY(-6px)}
.rc:focus-visible{outline:3px solid #fff;outline-offset:4px;border-radius:7%}
.rc.ready:not(.flip) .rb{animation:beck 1.9s ease-in-out infinite}
@keyframes beck{50%{filter:drop-shadow(0 0 26px #fff) drop-shadow(0 0 54px #ffffffbb) drop-shadow(0 16px 24px #000b)}}
.rc.ready.flip{cursor:default}
.rc.ready.flip:hover{transform:none}
.rc.flip .shine{animation:sweep 1.1s .25s ease-out,glint 3.8s 1.8s infinite}
@keyframes glint{0%{opacity:1;transform:translateX(-60%)}28%{opacity:1;transform:translateX(60%)}29%,100%{opacity:0;transform:translateX(60%)}}
.rf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:7%;overflow:hidden;filter:drop-shadow(0 0 16px #fffffff0) drop-shadow(0 0 40px #ffffff88) drop-shadow(0 16px 24px #000b)}
.rf img{width:100%;height:100%;display:block}
.rfr{transform:rotateY(180deg)}
.rn{position:absolute;left:0;right:0;top:calc(100% + 10px);text-align:center;font-weight:700;letter-spacing:.12em;color:#fff;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s;text-shadow:0 2px 8px #000a}
.rc.shown .rn{opacity:1;transform:none}
#rvall{font:inherit;color:#1b1d21;background:#fff;border:1px solid #fff;border-radius:999px;padding:9px 22px;font-size:15px;font-weight:700;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s;order:-1}
#rvx.on+#rvall{opacity:1;pointer-events:auto}
#rvx.on+#rvall:disabled{opacity:.35;pointer-events:none}
#rvall:focus-visible{outline:3px solid #fff;outline-offset:2px}
.rvbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#rvx{font:inherit;color:#fff;background:#ffffff1f;border:1px solid #ffffff55;border-radius:999px;padding:9px 22px;font-size:15px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s}
#rvx.on{opacity:1;pointer-events:auto}
#rvx:focus-visible{outline:3px solid #fff;outline-offset:2px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:7}
@media (prefers-reduced-motion:reduce){.rc.ready:not(.flip) .rb{animation:none}.rc.flip .shine{animation:none}.card.flipped{animation:none}.inner{transition-duration:.01s}.card.pop .inner,.card.flipped .shine{animation:none}}
@media(max-width:700px){.card-nav{min-height:42px;margin-bottom:5px}.card-nav-links{gap:15px;font-size:11px}.card-nav-brand{font-size:13px}}

    while(q[0].length&&q[1].length){const len=Math.min(q[c].length,1+Math.floor(Math.random()*3));for(let k=0;k<len;k++)out.push(q[c].shift());c=1-c}
    q[0].forEach(x=>out.push(x));q[1].forEach(x=>out.push(x));
    if(maxRun(out)<=3)return out}
  const out=[];for(let i=0;i<S.length;i++){out.push(S[i]);out.push(M[i])}return out}

let AWAY=76,R=300,rot=0,sel=0,vel=0,pending=-1;
function layout(){const w=Math.max(120,Math.min(innerWidth*.44,stage.clientHeight*.53/1.5115,300));

  slots.forEach((s,i)=>{const rel=Math.abs(norm(i*STEP+rot));s.classList.toggle('away',rel>AWAY);s.style.setProperty('--dim',(.55+.45*Math.cos(Math.min(rel,120)*Math.PI/240)).toFixed(2))});

addEventListener('pointermove',e=>{if(!down)return;

  if(moved){const dx=e.clientX-down.lx,now=performance.now(),k=360/Math.max(280,Math.min(innerWidth,700))*.9;

  if(amb&&fr%3===0){const r=slots[sel].getBoundingClientRect();
    P.push({x:r.left+r.width*(.05+Math.random()*.9),y:r.top+r.height*(.05+Math.random()*.9),vx:(Math.random()-.5)*.4,vy:-.3-Math.random()*.4,g:0,r:3+Math.random()*6,life:1,dec:.02+Math.random()*.02,rot:Math.random()*6,vr:.05,c:COL[Math.floor(Math.random()*COL.length)],tw:Math.random()*6})}
  if(revAmb&&fr%2===0){const fl=revEls.filter(e=>e.classList.contains('flip'));if(fl.length){const r=fl[Math.floor(Math.random()*fl.length)].getBoundingClientRect();P.push({x:r.left+r.width*(Math.random()*1.1-.05),y:r.top+r.height*(Math.random()*1.1-.05),vx:(Math.random()-.5)*.5,vy:-.3-Math.random()*.5,g:0,r:3+Math.random()*7,life:1,dec:.016+Math.random()*.02,rot:Math.random()*6,vr:.05,c:COL[Math.floor(Math.random()*COL.length)],tw:Math.random()*6})}}
  cx.clearRect(0,0,cv.width,cv.height);cx.save();cx.scale(dpr,dpr);P=P.filter(p=>p.life>0);
  for(const p of P){if(p.glow){p.life-=p.dec;cx.globalAlpha=Math.max(0,p.life)*.75;cx.shadowBlur=0;const g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#ffffff00');cx.fillStyle=g;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill();continue}p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy=p.vy*.97+p.g;p.rot+=p.vr;p.life-=p.dec;p.tw+=.35;
    cx.globalAlpha=Math.max(0,p.life)*(.65+.35*Math.sin(p.tw));cx.fillStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=10;star(p.x,p.y,p.r*(.5+p.life*.6),p.rot)}
  cx.restore();raf=(P.length||amb||revAmb)?requestAnimationFrame(loop):0}

  if(on)setTimeout(()=>{chime();const q=e.getBoundingClientRect();P.push({glow:1,x:q.left+q.width/2,y:q.top+q.height/2,r:Math.max(q.width,q.height)*.9,life:1,dec:.03});burst(q.left+q.width/2,q.top+q.height/2,40)},RM?5:260);else setTimeout(soft,200);

  updRvt(revEls.length)};
function whooshBig(){noise(.75,250,3000,.3)}
function popIn(e){const rp=e.firstChild;
  rp.animate([{transform:'scale(.15) rotate(-12deg)',opacity:0},{transform:'scale(1.14) rotate(3deg)',opacity:1,offset:.6},{transform:'scale(1) rotate(0deg)',opacity:1}],{duration:460,easing:'ease-out',fill:'forwards'});
  const q=e.getBoundingClientRect();P.push({glow:1,x:q.left+q.width/2,y:q.top+q.height/2,r:Math.max(q.width,q.height)*.8,life:1,dec:.05});burst(q.left+q.width/2,q.top+q.height/2,12);
  tone(880,0,.25,'sine',.07);tone(1320,.06,.3,'sine',.05);setTimeout(()=>e.classList.add('ready'),420)}
function charShow(els,types,cw,done){
  const W=innerWidth,H=innerHeight,n=els.length,S=Math.round(Math.max(60,Math.min(130,cw*.9,W*.22))),mf=document.getElementById('mf'),img=mf.querySelector('img'),st=mf.querySelector('.mst');
  mf.style.setProperty('--ms',S+'px');
  const cs=els.map(e=>{const r=e.getBoundingClientRect();return {x:r.left+r.width/2-S/2,y:r.top+r.height/2-S/2}});
  const hop=Math.max(120,Math.min(380,3000/n)),dwell=Math.max(90,hop*.7),y0=H*.4-S/2;
  const groups=[];['moss','stone'].forEach(k=>{const idx=types.map((t,i)=>t===k?i:-1).filter(i=>i>=0);
    if(idx.length)groups.push({k,idx:idx.sort((a,b)=>Math.abs(cs[a].y-cs[b].y)>10?cs[a].y-cs[b].y:cs[a].x-cs[b].x)})});
  const run=(g,dir,t0)=>{let t=t0;
    const xa=dir>0?-S*2.5:W+S*1.5,xb=dir>0?W+S:-S*2.5,xo=dir>0?-S*2.5:W+S*1.5,xe=dir>0?W+S:-S*2.5;
    setTimeout(()=>{img.src=IMG[g.k==='moss'?'moss':'stonechar'];mf.classList.toggle('rl',dir<0);whooshBig();
      mf.animate([{transform:'translate('+xa+'px,'+(y0+30)+'px) rotate('+(-8*dir)+'deg) scale(1.25,.9)',opacity:1},{transform:'translate('+(W*.5-S/2)+'px,'+(y0-40)+'px) rotate('+(5*dir)+'deg) scale(1.3,.85)',opacity:1,offset:.5},{transform:'translate('+xb+'px,'+(y0+10)+'px) rotate('+(-6*dir)+'deg) scale(1.25,.9)',opacity:1}],{duration:760,easing:'cubic-bezier(.45,.05,.55,.95)',fill:'forwards'});
      st.animate([{opacity:1},{opacity:1,offset:.95},{opacity:0}],{duration:760,fill:'forwards'});
      let tt=0;const tr=setInterval(()=>{tt+=60;if(tt>760){clearInterval(tr);mf.classList.remove('rl');return}const x=xa+(xb-xa)*(tt/760);burst(x+S/2,y0+S/2+20,5)},60)},t);
    t+=900;
    const seg=(from,to,dur,arc,start)=>setTimeout(()=>{whooshLite();mf.animate([{transform:'translate('+from[0]+'px,'+from[1]+'px) rotate('+(from[0]<to[0]?8:-8)+'deg)',opacity:1},{transform:'translate('+(from[0]+to[0])/2+'px,'+(Math.min(from[1],to[1])-arc)+'px) rotate(0deg) scale(1.08,.95)',opacity:1,offset:.55},{transform:'translate('+to[0]+'px,'+to[1]+'px) rotate(0deg) scale(1)',opacity:1}],{duration:dur,easing:'cubic-bezier(.3,.8,.4,1)',fill:'forwards'})},start);
    const f0=cs[g.idx[0]];seg([xe,f0.y-H*.2],[f0.x,f0.y],560,90,t);t+=560;
    g.idx.forEach((ci,k)=>{setTimeout(()=>popIn(els[ci]),t);
      if(k<g.idx.length-1){const nx=cs[g.idx[k+1]];seg([cs[ci].x,cs[ci].y],[nx.x,nx.y],hop,60,t+dwell);t+=dwell+hop}else t+=dwell});
    const la=cs[g.idx[g.idx.length-1]];seg([la.x,la.y],[xo,la.y-H*.15],520,40,t);t+=520;
    return t+150};
  let t=0;groups.forEach((g,i)=>{t=run(g,i%2===0?1:-1,t)});
  setTimeout(()=>{mf.getAnimations().forEach(a=>a.cancel());done()},t+60)}
go.onclick=()=>{if(!picked.length||revealing)return;revealing=true;ac();
  const list=picked.slice(),n=list.length,W=innerWidth,H=innerHeight;
  let cols=1,rows=n,cw=0;for(let c=1;c<=n;c++){const rr=Math.ceil(n/c),w=Math.min(230,(W-32-(c-1)*14)/c,(H*.56-(rr-1)*18)/rr/1.5115);if(w>cw){cw=w;cols=c;rows=rr}}

let musicOn=true,bgm=null,MG=null,volume=.7;
function dest(a){if(!MG||MG.context!==a){MG=a.createGain();MG.gain.value=volume*volume*2;MG.connect(a.destination)}return MG}
const vol=document.getElementById('vol');vol.oninput=()=>{volume=vol.value/100;if(MG)MG.gain.value=volume*volume*2};
function ctx(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function startBgm(){if(bgm||!musicOn)return;const a=ctx();if(!a)return;
  const out=a.createGain();out.gain.value=0;out.gain.linearRampToValueAtTime(.8,a.currentTime+3);out.connect(dest(a));
  const dl=a.createDelay(1.5);dl.delayTime.value=.42;const fb=a.createGain();fb.gain.value=.38;const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;
  dl.connect(lp);lp.connect(fb);fb.connect(dl);const bus=a.createGain();bus.connect(out);bus.connect(dl);dl.connect(out);
  const len=a.sampleRate*4,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);let b0=0,b1=0,b2=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;b0=.99*b0+w*.05;b1=.96*b1+w*.3;b2=.57*b2+w*1.05;d[i]=(b0+b1+b2+w*.18)*.1}
  const src=a.createBufferSource();src.buffer=buf;src.loop=true;
  const bp=a.createBiquadFilter();bp.type='bandpass';bp.Q.value=.7;bp.frequency.value=700;const wg=a.createGain();wg.gain.value=.13;
  const l1=a.createOscillator();l1.frequency.value=.06;const l1g=a.createGain();l1g.gain.value=380;l1.connect(l1g);l1g.connect(bp.frequency);
  const l2=a.createOscillator();l2.frequency.value=.09;const l2g=a.createGain();l2g.gain.value=.07;l2.connect(l2g);l2g.connect(wg.gain);
  src.connect(bp);bp.connect(wg);wg.connect(bus);src.start();l1.start();l2.start();
  const N5=[392,440,523,587,659,784,880];
  const timer=setInterval(()=>{if(!musicOn||document.hidden)return;const t=a.currentTime,root=Math.floor(Math.random()*5),cnt=1+Math.floor(Math.random()*2);
    for(let k=0;k<cnt;k++){const f=N5[Math.min(6,root+k*2)],o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,t+k*.5);g.gain.linearRampToValueAtTime(.02,t+k*.5+1.4);g.gain.exponentialRampToValueAtTime(.0001,t+k*.5+5);
      o.connect(g);g.connect(bus);o.start(t+k*.5);o.stop(t+k*.5+5.2)}},4200);
  bgm={out,timer}}
['pointerdown','pointerup','click','keydown','touchend'].forEach(ev=>addEventListener(ev,()=>{if(!bgm)startBgm()},{passive:true}));

mb.onclick=()=>{musicOn=!musicOn;mb.textContent='音樂：'+(musicOn?'開':'關');mb.setAttribute('aria-pressed',musicOn);
  if(bgm){const a=ctx();bgm.out.gain.cancelScheduledValues(a.currentTime);bgm.out.gain.linearRampToValueAtTime(musicOn?.8:0,a.currentTime+.8)}else if(musicOn)startBgm()};

  if(autoOn&&!down&&!tweening&&t>resumeAt&&!revealing){rot-=7*dt;draw()}
  requestAnimationFrame(autoLoop)}
